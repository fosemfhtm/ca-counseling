<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>상담 시간 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="admin">
  <header class="hero compact">
    <div class="wrap wide">
      <p class="eyebrow">관리자</p>
      <h1>상담 시간 관리</h1>
      <p class="lead">시간표를 드래그해서 상담 시간을 열고 닫거나 장소를 바꾼 뒤 <strong>저장</strong>을 누르세요.</p>
    </div>
  </header>

  <main class="wrap wide">
    <div class="banner" id="demo-banner" hidden>
      <strong>데모 모드</strong> — 서버에 저장되지 않습니다.
    </div>

    <!-- 로그인 -->
    <section class="card narrow" id="login" hidden>
      <h2>관리자 키 입력</h2>
      <p class="muted">Google 시트 메뉴 <strong>CA 상담 → 관리자 키 만들기 / 보기</strong>에서 확인할 수 있습니다. 이 브라우저에 저장됩니다.</p>
      <form id="login-form" class="login-row">
        <input name="key" type="password" autocomplete="off" required placeholder="관리자 키" aria-label="관리자 키">
        <button class="btn primary" type="submit">확인</button>
      </form>
      <p class="error" id="login-error" hidden></p>
    </section>

    <!-- 시간표 -->
    <section class="card" id="board" hidden>
      <div class="toolbar">
        <div class="week-nav">
          <button type="button" class="btn ghost small" id="prev-week" aria-label="이전 주">‹</button>
          <button type="button" class="btn ghost small" id="this-week">이번 주</button>
          <button type="button" class="btn ghost small" id="next-week" aria-label="다음 주">›</button>
          <strong id="week-label"></strong>
        </div>
        <div class="toolbar-opts">
          <label>칸 단위
            <select id="unit">
              <option value="30">30분</option>
              <option value="60">60분</option>
            </select>
          </label>
          <label>시간대
            <select id="hour-from"></select>–<select id="hour-to"></select>
          </label>
          <label class="inline-check"><input type="checkbox" id="weekend"> 주말</label>
        </div>
      </div>

      <div class="toolbar second">
        <div class="seg" role="radiogroup" aria-label="드래그 모드">
          <label><input type="radio" name="mode" value="toggle" checked><span>시간 열기·닫기</span></label>
          <label><input type="radio" name="mode" value="location"><span>장소 변경</span></label>
        </div>
        <label class="loc"><span id="loc-label">새로 여는 시간의 장소</span>
          <input id="location" maxlength="60" placeholder="예: 교내 던킨도너츠">
        </label>
      </div>
      <p class="mode-hint muted" id="mode-hint"></p>
      <ul class="legend" aria-label="범례">
        <li><i class="sw open"></i>열림</li>
        <li><i class="sw adding"></i>열기 예정</li>
        <li><i class="sw removing"></i>닫기 예정</li>
        <li><i class="sw reloc"></i>장소 변경 예정</li>
        <li><i class="sw booked"></i>예약됨</li>
      </ul>

      <div id="board-status" class="status" role="status"></div>
      <div class="grid-scroll">
        <div id="grid" class="tgrid" role="grid" aria-label="주간 상담 시간표"></div>
      </div>

      <div class="savebar">
        <span id="pending-text" class="muted">변경 사항 없음</span>
        <div class="savebar-btns">
          <button type="button" class="btn ghost" id="discard" disabled>되돌리기</button>
          <button type="button" class="btn primary" id="save" disabled>저장</button>
        </div>
      </div>
      <p class="admin-foot">
        <a href="./" target="_blank" rel="noopener">학생용 페이지 보기</a> ·
        <button type="button" class="link-btn" id="logout">이 브라우저에서 키 지우기</button>
      </p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js?v=3"></script>
</body>
</html>
